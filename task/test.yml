version: "3"

# Included from Taskfile.yml with the "test" namespace. The tasks call the
# helper tasks in Taskfile.yml with a leading ":", e.g. ":compose".

vars:
  # The minimum code coverage of src/, in percent. The "Tests" workflow in
  # GitHub Actions runs "task test:coverage", so it uses the same value.
  COVERAGE_THRESHOLD: 100

tasks:
  default:
    desc: "Run the PHPUnit test suite (no coverage)"
    cmds:
      - task: :compose
        vars:
          TASK_ARGS: exec phpfpm bin/console tailwind:build
      - task: :compose
        vars:
          TASK_ARGS: exec phpfpm vendor/bin/phpunit

  coverage:
    desc: "Run PHPUnit with coverage and check the coverage threshold"
    # The tasks use "run --rm --no-deps", so that they also work in GitHub
    # Actions, where the other containers do not run.
    cmds:
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps phpfpm composer install --no-scripts
      # The pages in the tests need the packages of the importmap and the
      # CSS from Tailwind.
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps phpfpm bin/console importmap:install
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps phpfpm bin/console tailwind:build
      # The kernel calls some code in src/Kernel.php only when it builds the
      # container. Remove the test cache, so that the result is the same
      # each time.
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps phpfpm rm -rf var/cache/test
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps -e XDEBUG_MODE=coverage phpfpm vendor/bin/phpunit --coverage-clover=coverage/clover.xml
      - task: :compose
        vars:
          TASK_ARGS: run --rm --no-deps phpfpm vendor/bin/coverage-check coverage/clover.xml {{.COVERAGE_THRESHOLD}}
