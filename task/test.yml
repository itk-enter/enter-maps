version: "3"

# Included from Taskfile.yml with the "test" namespace. The tasks call the
# helper tasks in Taskfile.yml with a leading ":", e.g. ":compose".

tasks:
  default:
    desc: "Run the PHPUnit test suite (no coverage)"
    cmd:
      task: :compose
      vars:
        TASK_ARGS: exec phpfpm vendor/bin/phpunit

  coverage:
    desc: "Run PHPUnit with coverage and enforce the 100% gate"
    cmds:
      # The kernel calls some code in src/Kernel.php only when it builds the
      # container. Remove the test cache, so that the result is the same as
      # in GitHub Actions, where the cache is always empty.
      - task: :compose
        vars:
          TASK_ARGS: exec phpfpm rm -rf var/cache/test
      - task: :compose
        vars:
          TASK_ARGS: exec -e XDEBUG_MODE=coverage phpfpm vendor/bin/phpunit --coverage-clover=coverage/clover.xml
      - task: :compose
        vars:
          TASK_ARGS: exec phpfpm vendor/bin/coverage-check coverage/clover.xml 100
