version: '3'

# https://taskfile.dev/usage/#env-files
dotenv: ['.env.local', '.env']

includes:
  code-analysis: ./task/code-analysis.yml
  coding-standards: ./task/coding-standards.yml
  rector: ./task/rector.yml
  test: ./task/test.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  console:
    desc: 'Run a Symfony console command, e.g. `task {{.TASK}} -- debug:router`'
    cmd:
      task: php
      vars:
        TASK_ARGS: bin/console

  assets:build:
    desc: 'Build the CSS with Tailwind. Add `-- --watch` to build again on each change.'
    cmd:
      task: php
      vars:
        TASK_ARGS: bin/console tailwind:build

  screenshot:
    desc: 'Take screenshots of pages of the dev site, e.g. `task {{.TASK}} -- / builder=/builder`'
    # The playwright container takes a desktop and a phone screenshot of each
    # page, and saves them in var/screenshots/. See tests/Browser/screenshot.js.
    cmds:
      - docker compose run --rm --no-deps playwright sh -c "npm ci --no-audit --no-fund --loglevel=error && node screenshot.js {{.CLI_ARGS}}"

  screenshot:publish:
    desc: 'Put the screenshots on the branch pr-screenshots, e.g. `task {{.TASK}} -- 26`'
    # Runs on the host, because it pushes with git. It writes the Markdown for
    # the description of the pull request. See tests/Browser/publish-screenshots.sh.
    cmds:
      - tests/Browser/publish-screenshots.sh {{.CLI_ARGS}}

  compose:
    internal: true
    cmd: 'docker compose {{.TASK_ARGS}} {{.CLI_ARGS}}'

  composer:
    internal: true
    cmd:
      task: compose
      vars:
        TASK_ARGS: exec phpfpm composer {{.TASK_ARGS}}

  php:
    internal: true
    cmd:
      task: compose
      vars:
        TASK_ARGS: exec phpfpm php {{.TASK_ARGS}}
