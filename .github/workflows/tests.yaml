name: Tests

env:
  COMPOSE_USER: runner

on:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: docker network create frontend

      - name: Install dependencies
        run: docker compose run --rm --no-deps phpfpm composer install

      - name: Run PHPUnit with coverage
        run: docker compose run -e XDEBUG_MODE=coverage --rm --no-deps phpfpm vendor/bin/phpunit --coverage-clover=coverage/clover.xml

      - name: Enforce coverage threshold (100%)
        run: docker compose run --rm --no-deps phpfpm vendor/bin/coverage-check coverage/clover.xml 100
