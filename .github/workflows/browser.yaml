# This workflow is for this project only. It does not come from
# https://github.com/itk-dev/devops_itkdev-docker.
name: Browser tests

env:
  COMPOSE_USER: runner

on:
  pull_request:

jobs:
  playwright:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2

      - name: Create docker network
        run: docker network create frontend

      # The tests use stubs for Enter, Adressevælger and the tiles. See
      # tests/Browser/support.js.
      # "--yes" answers the question before the task deletes the data in
      # the database.
      - name: Run the browser tests
        run: task --yes test:browser

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: var/browser/
          retention-days: 7
