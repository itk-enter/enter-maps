twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/theme.html.twig']
    # The app stores dates in UTC (see Kernel). The pages show them in the local time of the editors.
    date:
        timezone: Europe/Copenhagen
    globals:
        # The browser sends the token to Adressevælger. See .env.
        adressevaelger_token: '%env(ADRESSEVAELGER_TOKEN)%'
        # The address search gives only addresses in this municipality. See .env.
        adressevaelger_municipality_code: '%env(ADRESSEVAELGER_MUNICIPALITY_CODE)%'

when@test:
    twig:
        strict_variables: true
