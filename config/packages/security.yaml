security:
    # The users of the builder. EmployeeAuthenticator makes them on the first login.
    providers:
        users:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The map on other sites: the embed page and the data proxy need no
        # login, and they do not use the session.
        public:
            pattern: ^/(embed|data)/
            security: false
        main:
            lazy: true
            provider: users
            # The login with OpenID Connect on itk-dev/openid-connect-bundle.
            custom_authenticators:
                - App\Security\EmployeeAuthenticator
            entry_point: App\Security\EmployeeAuthenticator
            access_denied_handler: App\Security\AccessDeniedPage
            logout:
                path: app_logout

    # The same paths as the basic auth on the server: the firewalls "dev" and
    # "public" let /embed/, /data/ and /assets/ through without a login. All
    # other paths need an employee. Only the first rule that matches applies.
    access_control:
        - { path: ^/(openidconnect/login/|logged-out$), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_EMPLOYEE }
