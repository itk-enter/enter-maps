security:
    # The users of the builder log in with OpenID Connect. See src/Security.
    providers:
        oidc:
            id: App\Security\OidcUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The map on other sites: the embed page and the data proxy need no
        # login, and they do not use the session.
        public:
            pattern: ^/(embed|data)/
            security: false
        main:
            lazy: true
            provider: oidc
            # The access token authenticator checks the ID token from the
            # callback of the login once. Then the session keeps the user.
            # The token handler is below, for each environment.
            # https://symfony.com/doc/current/security/access_token.html#using-openid-connect-oidc
            access_token:
                token_extractors: App\Security\SessionTokenExtractor
                failure_handler: App\Security\AccessDeniedPage
            entry_point: App\Security\LoginEntryPoint
            access_denied_handler: App\Security\AccessDeniedPage
            logout:
                path: app_logout

    # The same paths as the basic auth on the server: the firewalls "dev" and
    # "public" let /embed/, /data/ and /assets/ through without a login. All
    # other paths need an employee. Only the first rule that matches applies.
    access_control:
        - { path: ^/(login|logged-out)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_EMPLOYEE }

# The keys of the provider come from its discovery document.
when@dev: &discovery
    security:
        firewalls:
            main:
                access_token:
                    token_handler:
                        oidc:
                            claim: sub
                            algorithms: ['RS256']
                            audience: '%env(OIDC_CLIENT_ID)%'
                            issuers: ['%env(OIDC_ISSUER)%']
                            discovery:
                                base_uri: '%env(OIDC_ISSUER)%/'
                                cache:
                                    id: cache.app
                                # The mock provider gives its key without "use", so .env.dev turns this off.
                                enforce_key_usage_verification: '%env(bool:OIDC_ENFORCE_KEY_USAGE)%'

when@prod: *discovery

# The tests sign the ID tokens with the key in tests/Support/oidc-test-key.json,
# so they need no provider.
when@test:
    security:
        firewalls:
            main:
                access_token:
                    token_handler:
                        oidc:
                            claim: sub
                            algorithms: ['RS256']
                            audience: '%env(OIDC_CLIENT_ID)%'
                            issuers: ['%env(OIDC_ISSUER)%']
                            keyset: '%env(OIDC_TEST_KEYSET)%'
